name: Apply reviewed OG SPORTS composition
on:
  push:
    branches: [feat/og-sports-web]
    paths: [.github/workflows/import-og-sports-review.yml]
permissions:
  contents: read
concurrency:
  group: og-sports-review-import
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'Zilli-on/fastr-report' && github.ref == 'refs/heads/feat/og-sports-web'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/og-sports-web
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Link the reviewed stylesheet and correct preview notes
        id: apply
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, os, re
          target = Path('og-sports/site/index.html')
          original = target.read_bytes()
          text = original.decode('utf-8')
          if 'href="refinement.css"' in text:
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write('changed=false\n')
              raise SystemExit(0)
          expected = 'edc7f03da1a0a42b02a9a5e2cebf55b5831636e3'
          actual = hashlib.sha1(b'blob ' + str(len(original)).encode() + b'\0' + original).hexdigest()
          if actual != expected:
              raise SystemExit('Source changed since review; refusing to overwrite it.')
          assert Path('og-sports/site/refinement.css').is_file()
          assert Path('og-sports/scripts/composition_review.py').is_file()
          anchor = '<link href="styles.css" rel="stylesheet"/>'
          assert text.count(anchor) == 1
          text = text.replace(anchor, anchor + '\n<link href="refinement.css" rel="stylesheet"/>')
          text = text.replace('Webvorschau — Review 1', 'Webvorschau — Review 2').replace('Web preview — Review 1', 'Web preview — Review 2')
          text = text.replace('Auftritt V21', 'Auftritt / Review 2').replace('Direction V21', 'Direction / Review 2')
          text = text.replace('Die Website ist eine private Designvorschau, keine veröffentlichte Kampagne.', 'Die Website ist eine öffentliche Designvorschau, keine freigegebene Werbekampagne. Noindex ist kein Zugriffsschutz.')
          text = text.replace('This website is a private design preview, not a published campaign.', 'This website is a public design review, not a cleared advertising campaign. Noindex is not access protection.')
          de = 'Alle Bilder und Originalzeichen werden als Dateien aus derselben Website geladen. Die OG-SPORTS-Seite bindet keine externen Schriftdateien oder Analyse-Skripte ein. Die Bildnachweise verlinken zu den ursprünglichen Quellen. Reduzierte Bewegung wird berücksichtigt.'
          en = 'All images and original marks are served as files from this website. The OG SPORTS page does not embed external fonts or analytics scripts. Image credits link to the original sources. Reduced-motion preferences are respected.'
          pattern = r'<p\b[^>]*data-network-note=""[^>]*>.*?</p>'
          assert len(re.findall(pattern, text, flags=re.S)) == 1
          text = re.sub(pattern, '<p data-de="' + de + '" data-en="' + en + '" data-network-note="">' + de + '</p>', text, count=1, flags=re.S)
          target.write_text(text, encoding='utf-8')
          payload = {'message':'design: activate reviewed OG SPORTS composition and accurate hosting notes',
                     'content':base64.b64encode(target.read_bytes()).decode('ascii'),
                     'sha':expected, 'branch':'feat/og-sports-web'}
          Path(os.environ['RUNNER_TEMP'], 'og-review-update.json').write_text(json.dumps(payload))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('changed=true\n')
          PY
      - name: Check the exact proposed source and build
        working-directory: og-sports
        run: npm run check
      - name: Prepare isolated browser tools
        run: |
          python3 -m venv "$RUNNER_TEMP/og-browser"
          "$RUNNER_TEMP/og-browser/bin/pip" install --disable-pip-version-check playwright==1.55.0
          "$RUNNER_TEMP/og-browser/bin/python" -m playwright install --with-deps chromium
      - name: Check all existing interactions
        working-directory: og-sports
        run: '"$RUNNER_TEMP/og-browser/bin/python" scripts/browser_smoke.py'
      - name: Check the new composition and record screenshots
        working-directory: og-sports
        run: '"$RUNNER_TEMP/og-browser/bin/python" scripts/composition_review.py'
      - name: Commit only the tested HTML to the existing review branch
        if: steps.apply.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT repos/Zilli-on/fastr-report/contents/og-sports/site/index.html --input "$RUNNER_TEMP/og-review-update.json" --jq '.commit.sha'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: og-sports-composition-review
          path: |
            og-sports/qa/composition-*.png
            og-sports/qa/composition-review.json
            og-sports/qa/browser-smoke.json
            og-sports/dist/
          retention-days: 7
