name: Apply OG SPORTS fashion-community review
on:
  push:
    branches: [feat/og-sports-web]
    paths: [.github/workflows/import-og-sports-review.yml]
permissions:
  contents: read
concurrency:
  group: og-sports-review-import
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'Zilli-on/fastr-report' && github.ref == 'refs/heads/feat/og-sports-web'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Import exact locally reviewed source
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --max-time 60 'https://d2ol7oe51mr4n9.cloudfront.net/user_3F3NUVidPhiNDKfYWHhux0P34eP/70f9097d-ad73-49f8-ba82-1af595c6637d.zip' -o /tmp/review4.zip
          echo '279aa17c904312d7ea58611cb0ee9758aece7dd65591b594bdf2093e57c9acd3  /tmp/review4.zip' | sha256sum --check
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, zipfile
          root=Path('og-sports')
          expected={
            'site/index.html':'26dae18f74a145ce07727e450cba07f065e880dff537a12a7a5fe8979d62561c',
            'site/review4.css':'357c261eb7b2894e0b0c167640d96fc5c7fc2a6b3a34cfd9c9f1a6b729258275',
            'site/assets/run-detail.webp':'dcc5694b8245f1b3fa138ebb5b16d09172d20f4ab9817a89bf1097e33bd89b93',
            'site/assets/run-shadow.webp':'f1ffa9de0ca17daac7aca5a389b136c45dcdcab9fdbc849f17c62a71082b6469',
            'site/assets/run-community.webp':'546bdde1f8b68413484528b5d3b2cfa245fb2331b56bba41e8cf57dcb7c439f2',
            'docs/photo_sources.json':'76916d8c51cecfd7e0a54dfd43731741e62ca92af7dc616f832f82f239f58c1e',
            'docs/PHOTO_CREDITS.md':'854062425deae68ee7e5bf8d72a7bf3f3ad6408a29d1240d4de711fb2a6b76fb',
            'scripts/review4_smoke.py':'503b2db65b6345e7ee45fabf52efcb14b1b8000a5ff9862931b055e1f8fec9cb'
          }
          with zipfile.ZipFile('/tmp/review4.zip') as z:
            names=set(z.namelist())
            assert names==set(expected), (names,set(expected))
            for name,digest in expected.items():
              pp=PurePosixPath(name)
              assert not pp.is_absolute() and '..' not in pp.parts
              data=z.read(name)
              assert hashlib.sha256(data).hexdigest()==digest,name
              target=root/name
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(data)
          print('Imported exact Review 4 source and three credited photographs.')
          PY
          git diff --check
      - name: Source, asset-integrity, HTTP and build checks
        working-directory: og-sports
        run: npm run check
      - name: Prepare browser review tools
        run: |
          python3 -m venv "$RUNNER_TEMP/og-browser"
          "$RUNNER_TEMP/og-browser/bin/pip" install --disable-pip-version-check playwright==1.55.0
          "$RUNNER_TEMP/og-browser/bin/python" -m playwright install --with-deps chromium
      - name: Six responsive browser widths and existing project interactions
        working-directory: og-sports
        run: '"$RUNNER_TEMP/og-browser/bin/python" scripts/review4_smoke.py'
      - name: Commit only tested Review 4 files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          lines=subprocess.check_output(['git','status','--porcelain'],text=True).splitlines()\n          changed={line[3:] for line in lines if len(line)>=4}
          allowed={
            'og-sports/site/index.html','og-sports/site/review4.css',
            'og-sports/site/assets/run-detail.webp','og-sports/site/assets/run-shadow.webp',
            'og-sports/site/assets/run-community.webp','og-sports/docs/photo_sources.json',
            'og-sports/docs/PHOTO_CREDITS.md','og-sports/scripts/review4_smoke.py'
          }
          assert changed <= allowed, changed
          assert {'og-sports/site/index.html','og-sports/site/review4.css'} <= changed
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- og-sports/site/index.html og-sports/site/review4.css og-sports/site/assets/run-detail.webp og-sports/site/assets/run-shadow.webp og-sports/site/assets/run-community.webp og-sports/docs/photo_sources.json og-sports/docs/PHOTO_CREDITS.md og-sports/scripts/review4_smoke.py
          git diff --cached --check
          git commit -m 'design: rebuild OG SPORTS as a fashion-community brand world'
          cat > "$RUNNER_TEMP/og-askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/og-askpass"
          trap 'rm -f "$RUNNER_TEMP/og-askpass"' EXIT
          GIT_ASKPASS="$RUNNER_TEMP/og-askpass" GIT_TERMINAL_PROMPT=0 git push origin HEAD:refs/heads/feat/og-sports-web
          printf '## OG SPORTS Review 4\n\n[Exact public preview](https://raw.githack.com/Zilli-on/fastr-report/%s/og-sports/site/index.html)\n\nNo merge and no Vercel production deployment.\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: og-sports-review4-evidence
          path: |
            og-sports/qa/review4-smoke.json
            og-sports/qa/review4-*.png
            og-sports/dist/
          retention-days: 7
