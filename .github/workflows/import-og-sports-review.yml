name: Apply reviewed OG SPORTS brand direction
on:
  push:
    branches: [feat/og-sports-web]
    paths: [.github/workflows/import-og-sports-review.yml]
permissions:
  contents: read
concurrency:
  group: og-sports-review-import
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'Zilli-on/fastr-report' && github.ref == 'refs/heads/feat/og-sports-web'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply only the exact locally reviewed source changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('og-sports')
          change = json.loads((root/'docs/review-3-changes.json').read_text())
          allowed = {'index.html', 'refinement.css'}
          assert set(change['before']) == allowed == set(change['after'])
          digest = lambda data: hashlib.sha256(data).hexdigest()
          current = {name: (root/'site'/name).read_bytes() for name in allowed}
          if all(digest(current[name]) == change['after'][name] for name in allowed):
              print('Reviewed source already applied; no changes needed.')
          else:
              for name in allowed:
                  assert digest(current[name]) == change['before'][name], 'Source changed: ' + name
              css = (root/'docs/review-3-design.css').read_bytes()
              assert digest(css) == change['css_sha256'], 'CSS payload mismatch'
              html = current['index.html'].decode('utf-8')
              limit = len(html)
              for start, end, replacement in reversed(change['html_edits']):
                  assert isinstance(start, int) and isinstance(end, int)
                  assert 0 <= start <= end <= limit
                  html = html[:start] + replacement + html[end:]
                  limit = start
              proposed = {'index.html': html.encode('utf-8'),
                          'refinement.css': current['refinement.css'] + css}
              for name in allowed:
                  assert digest(proposed[name]) == change['after'][name], 'Output mismatch: ' + name
              for name in allowed:
                  (root/'site'/name).write_bytes(proposed[name])
              print('Exact reviewed HTML and CSS applied. Assets untouched.')
          PY
          git diff --check
      - name: Source, asset-integrity, HTTP and build checks
        working-directory: og-sports
        run: npm run check
      - name: Prepare isolated browser tools
        run: |
          python3 -m venv "$RUNNER_TEMP/og-browser"
          "$RUNNER_TEMP/og-browser/bin/pip" install --disable-pip-version-check playwright==1.55.0
          "$RUNNER_TEMP/og-browser/bin/python" -m playwright install --with-deps chromium
      - name: Existing interactions and image proportions
        working-directory: og-sports
        run: |
          "$RUNNER_TEMP/og-browser/bin/python" scripts/browser_smoke.py
          "$RUNNER_TEMP/og-browser/bin/python" scripts/composition_review.py
      - name: Bilingual brand chapters and closing composition
        working-directory: og-sports
        run: '"$RUNNER_TEMP/og-browser/bin/python" scripts/brand_review.py'
      - name: Commit only the tested source to the existing review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          allowed = {'og-sports/site/index.html','og-sports/site/refinement.css'}
          assert changed <= allowed, changed
          PY
          if git diff --quiet -- og-sports/site/index.html og-sports/site/refinement.css; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- og-sports/site/index.html og-sports/site/refinement.css
          git diff --cached --check
          git commit -m 'design: reveal the brand narrative and sharpen each visual chapter'
          cat > "$RUNNER_TEMP/og-askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/og-askpass"
          trap 'rm -f "$RUNNER_TEMP/og-askpass"' EXIT
          GIT_ASKPASS="$RUNNER_TEMP/og-askpass" GIT_TERMINAL_PROMPT=0 git push origin HEAD:refs/heads/feat/og-sports-web
          printf '## Tested OG SPORTS Review 3\n\nCommit: `%s`\n\n[Exact public review](https://raw.githack.com/Zilli-on/fastr-report/%s/og-sports/site/index.html)\n\nNo merge, no Vercel deployment, no change to main.\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: og-sports-brand-review
          path: |
            og-sports/qa/browser-smoke.json
            og-sports/qa/composition-review.json
            og-sports/qa/brand-review.json
            og-sports/qa/brand-*.png
            og-sports/dist/
          retention-days: 7
