name: OG SPORTS website review
on:
  push:
    branches: [feat/og-sports-web]
    paths:
      - 'og-sports/**'
      - '.github/workflows/og-sports-review.yml'
  pull_request:
    paths:
      - 'og-sports/**'
      - '.github/workflows/og-sports-review.yml'
permissions:
  contents: read
concurrency:
  group: og-sports-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Source, original asset integrity, HTTP and build
        working-directory: og-sports
        run: npm run check
      - name: Preserve reviewed built website
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: og-sports-r7-built-website
          path: og-sports/dist/
          retention-days: 7
          if-no-files-found: error
      - name: Install isolated browser tools
        run: |
          python3 -m venv "$RUNNER_TEMP/og-browser"
          "$RUNNER_TEMP/og-browser/bin/pip" install --disable-pip-version-check playwright==1.55.0
          "$RUNNER_TEMP/og-browser/bin/python" -m playwright install --with-deps chromium
      - name: Seven viewport tests, project details, bilingual UI and photo boundary
        working-directory: og-sports
        run: '"$RUNNER_TEMP/og-browser/bin/python" scripts/review7_visual.py'
      - name: Report exact review URL
        if: github.event_name == 'push'
        env:
          REVIEW_SHA: ${{ github.sha }}
        run: |
          printf '## OG SPORTS R7\n\n[Exact commit web preview](https://raw.githack.com/Zilli-on/fastr-report/%s/og-sports/site/index.html)\n\nPublic design review, not Vercel or production. No merge or deployment.\n' "$REVIEW_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: og-sports-r7-visual-evidence
          path: |
            og-sports/qa/review7-visual.json
            og-sports/qa/r7-*.png
            og-sports/dist/build-manifest.json
          retention-days: 7
