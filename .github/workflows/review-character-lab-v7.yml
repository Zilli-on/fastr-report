name: Review OG FASTR Character Lab v7

on:
  push:
    branches: [main]
    paths:
      - 'character-lab-v7/**'
      - '.github/workflows/review-character-lab-v7.yml'

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm init -y && npm install playwright@1.55.0
      - run: npx playwright install chromium --with-deps
      - name: Serve exact checked-out build
        run: |
          python3 -m http.server 4173 > /tmp/ogfastr-server.log 2>&1 &
          sleep 2
      - name: Capture exact commit renders
        timeout-minutes: 4
        run: |
          mkdir -p review-v7
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser = await chromium.launch({headless:true,args:['--enable-unsafe-swiftshader','--disable-dev-shm-usage']});
            const page = await browser.newPage({viewport:{width:1440,height:900}, deviceScaleFactor:1});
            page.setDefaultTimeout(120000);
            page.on('console',m=>console.log('BROWSER:',m.type(),m.text()));
            page.on('pageerror',e=>console.log('PAGEERROR:',e.message));
            await page.goto('http://127.0.0.1:4173/character-lab-v7/', {waitUntil:'networkidle', timeout:120000});
            await page.waitForTimeout(3800);
            await page.screenshot({path:'review-v7/hero.png', timeout:120000, animations:'disabled'});
            await page.locator('button[data-mode="inspect"]').click({force:true});
            await page.waitForTimeout(700);
            await page.screenshot({path:'review-v7/inspect.png', timeout:120000, animations:'disabled'});
            await page.locator('button[data-view="front"]').click({force:true});
            await page.waitForTimeout(500);
            await page.screenshot({path:'review-v7/front.png', timeout:120000, animations:'disabled'});
            await browser.close();
          })();
          NODE
      - name: Upload exact review renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: og-fastr-v7-live-review
          path: review-v7/
          if-no-files-found: warn
          retention-days: 3
