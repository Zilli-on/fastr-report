name: Review OG FASTR Character Lab v7

on:
  push:
    branches: [main]
    paths:
      - 'character-lab-v7/**'
      - '.github/workflows/review-character-lab-v7.yml'

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm init -y && npm install playwright@1.55.0
      - run: npx playwright install chromium --with-deps
      - name: Serve exact checked-out build
        run: |
          python3 -m http.server 4173 > /tmp/ogfastr-server.log 2>&1 &
          echo $! > /tmp/ogfastr-server.pid
          sleep 2
      - name: Capture exact commit renders
        run: |
          mkdir -p review-v7
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1600,height:1000}, deviceScaleFactor:1});
            page.on('console',m=>console.log('BROWSER:',m.type(),m.text()));
            page.on('pageerror',e=>console.log('PAGEERROR:',e.message));
            await page.goto('http://127.0.0.1:4173/character-lab-v7/', {waitUntil:'networkidle', timeout:120000});
            await page.waitForTimeout(5000);
            await page.screenshot({path:'review-v7/hero.png', fullPage:true});
            await page.getByRole('button',{name:'Print inspect'}).click();
            await page.waitForTimeout(1200);
            await page.screenshot({path:'review-v7/inspect.png', fullPage:true});
            await page.getByRole('button',{name:'Front'}).click();
            await page.waitForTimeout(800);
            await page.screenshot({path:'review-v7/front.png', fullPage:true});
            await browser.close();
          })();
          NODE
      - name: Upload exact review renders
        uses: actions/upload-artifact@v4
        with:
          name: og-fastr-v7-live-review
          path: review-v7/
          retention-days: 3
